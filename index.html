<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7bc9a6" />
  <title>Mon Journal Alimentaire</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Journal" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="config.js"></script>
</head>
<body>

  <!-- ÉCRAN DE CONNEXION -->
  <section id="auth-view" class="auth-view hidden">
    <div class="auth-card">
      <div class="auth-logo">🥗</div>
      <h1>Mon Journal Alimentaire</h1>
      <p class="auth-sub">Suivez vos repas, votre hydratation et votre bien-être, jour après jour.</p>

      <form id="auth-form" autocomplete="on">
        <label>Email
          <input type="email" id="auth-email" required placeholder="vous@email.com" autocomplete="email" />
        </label>
        <label>Mot de passe
          <input type="password" id="auth-password" required minlength="6" placeholder="••••••••" autocomplete="current-password" />
        </label>
        <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Se connecter</button>
      </form>

      <p class="auth-toggle">
        <span id="auth-toggle-text">Pas encore de compte ?</span>
        <a href="#" id="auth-toggle-link">Créer un compte</a>
      </p>
      <p id="auth-message" class="auth-message"></p>
      <p id="auth-config-warning" class="auth-config hidden">
        ⚙️ Configuration requise : renseignez vos identifiants Supabase dans <code>config.js</code>.
      </p>
    </div>
    <p class="signature">By <span>Tadam-3D</span></p>
  </section>

  <!-- APPLICATION -->
  <div id="app-view" class="app-view hidden">

    <header class="app-header">
      <div class="date-nav">
        <button id="day-prev" class="icon-btn" aria-label="Jour précédent">‹</button>
        <button id="day-picker-btn" class="date-label">
          <span id="current-date-label">Aujourd'hui</span>
          <input type="date" id="current-date" class="date-input-hidden" />
        </button>
        <button id="day-next" class="icon-btn" aria-label="Jour suivant">›</button>
      </div>
      <button id="today-btn" class="btn btn-ghost btn-sm">Aujourd'hui</button>
    </header>

    <main class="app-main">
      <!-- Onglet JOURNÉE -->
      <div id="tab-journee" class="tab-panel active"></div>
      <!-- Onglet HISTORIQUE -->
      <div id="tab-historique" class="tab-panel"></div>
      <!-- Onglet ANALYSES -->
      <div id="tab-analyses" class="tab-panel"></div>
      <!-- Onglet BIEN-ÊTRE -->
      <div id="tab-bienetre" class="tab-panel"></div>
      <!-- Onglet RÉGLAGES -->
      <div id="tab-reglages" class="tab-panel"></div>
    </main>

    <nav class="tabbar">
      <button class="tab-btn active" data-tab="journee"><span>📅</span>Journée</button>
      <button class="tab-btn" data-tab="historique"><span>📖</span>Historique</button>
      <button class="tab-btn" data-tab="analyses"><span>📊</span>Analyses</button>
      <button class="tab-btn" data-tab="bienetre"><span>💚</span>Bien-être</button>
      <button class="tab-btn" data-tab="reglages"><span>⚙️</span>Réglages</button>
    </nav>
  </div>

  <!-- Conteneur des fenêtres modales -->
  <div id="modal-root"></div>

  <!-- Zone de notifications (toasts) -->
  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () =>
        navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
