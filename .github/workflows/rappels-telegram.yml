name: Rappels de saisie (Telegram)

# Les rappels sont désormais CONFIGURABLES depuis l'app (Réglages → 🔔 Rappels),
# stockés dans la table public.reminders. Ce workflow tourne toutes les 15 min,
# lit les rappels dus (heure de Paris) et envoie ceux qui doivent l'être.
# « Intelligent » = envoyé seulement si le repas n'est pas déjà saisi
# (ou, pour la pesée, si aucune pesée cette semaine). Une garde (last_sent_on)
# évite les doublons : chaque rappel part au plus une fois par jour.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer un message de TEST tout de suite (ignore l'heure et la vérification)"
        type: boolean
        default: false

jobs:
  rappel:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les secrets
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MISS=0
          if [ -z "$DB" ];   then echo "::warning::Secret SUPABASE_DB_URL MANQUANT";   MISS=1; else echo "SUPABASE_DB_URL : présent ✔"; fi
          if [ -z "$BOT" ];  then echo "::warning::Secret TELEGRAM_BOT_TOKEN MANQUANT"; MISS=1; else echo "TELEGRAM_BOT_TOKEN : présent ✔"; fi
          if [ -z "$CHAT" ]; then echo "::warning::Secret TELEGRAM_CHAT_ID MANQUANT";   MISS=1; else echo "TELEGRAM_CHAT_ID : présent ✔"; fi
          if [ "$MISS" = "1" ]; then
            echo "SKIP=1" >> "$GITHUB_ENV"
            echo "::warning::Rappel ignoré — voir docs/RAPPELS-TELEGRAM.md."
          fi

      - name: S'assurer que psql est disponible
        if: env.SKIP != '1'
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Envoyer les rappels dus
        if: env.SKIP != '1'
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ github.event.inputs.test }}
          APP_URL: "https://food-tracker-gilt-three.vercel.app/"
        run: |
          set -euo pipefail

          # Nettoyer les secrets (espaces / sauts de ligne collés par erreur)
          BOT="$(printf '%s' "$BOT" | tr -d '[:space:]')"; BOT="${BOT#bot}"
          CHAT="$(printf '%s' "$CHAT" | tr -d '[:space:]')"

          send() {  # $1 = texte ; retourne 0 si Telegram accepte
            RESP="$(curl -sS -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
              -d chat_id="${CHAT}" --data-urlencode text="$1")"
            case "$RESP" in
              *'"ok":true'*) echo "  → envoyé ✅"; return 0 ;;
              *) echo "::error::Telegram a refusé : ${RESP}"; return 1 ;;
            esac
          }

          # --- Mode TEST manuel ---
          if [ "${TEST:-false}" = "true" ]; then
            send "✅ Test OK — les rappels Telegram de ton Journal Alimentaire fonctionnent ! 🥗" || exit 1
            exit 0
          fi

          # --- Récupérer les rappels DUS (tout calculé côté Postgres, heure de Paris) ---
          QUERY="
          with ctx as (
            select timezone('Europe/Paris', now()) as ts,
                   (timezone('Europe/Paris', now()))::date as d,
                   (timezone('Europe/Paris', now()))::time as t,
                   extract(dow from timezone('Europe/Paris', now()))::int as dow
          )
          select r.id, replace(
            coalesce(nullif(r.message,''),
              case r.kind
                when 'poids'  then coalesce(r.emoji,'⚖️') || ' Rappel — pense à te peser cette semaine !'
                when 'encas'  then coalesce(r.emoji,'🍎') || ' Rappel — pense à noter ton encas si tu en as pris.'
                when 'custom' then coalesce(r.emoji,'⏰') || ' ' || coalesce(r.label,'Rappel')
                else '⏰ Rappel — tu n''as pas encore saisi ton ' || coalesce(r.label, r.kind) || ' aujourd''hui.'
              end), chr(9), ' ')
          from public.reminders r, ctx
          where r.enabled
            and (r.weekday is null or r.weekday = ctx.dow)
            and ctx.t >= r.at_time
            and (r.last_sent_on is distinct from ctx.d)
            and (
              not r.smart
              or (r.kind in ('petit_dejeuner','dejeuner','diner','encas') and not exists (
                    select 1 from public.meals m join public.meal_items mi on mi.meal_id = m.id
                    where m.user_id = r.user_id and m.meal_date = ctx.d and m.meal_type = r.kind))
              or (r.kind = 'poids' and not exists (
                    select 1 from public.weights w
                    where w.user_id = r.user_id and w.log_date >= date_trunc('week', ctx.ts)::date))
              or (r.kind = 'custom')
            );
          "

          DUE="$(psql "$DB" -tA -F $'\t' -c "$QUERY")"

          if [ -z "$DUE" ]; then
            echo "Aucun rappel dû pour le moment."
            exit 0
          fi

          # --- Envoyer chaque rappel dû, puis marquer l'envoi (anti-doublon) ---
          while IFS=$'\t' read -r ID MSG; do
            [ -z "$ID" ] && continue
            echo "Rappel dû : ${MSG}"
            FULL="${MSG}"$'\n'"👉 ${APP_URL}"
            if send "$FULL"; then
              psql "$DB" -q -c \
                "update public.reminders set last_sent_on = (timezone('Europe/Paris', now()))::date where id = '${ID}';"
            fi
          done <<< "$DUE"
