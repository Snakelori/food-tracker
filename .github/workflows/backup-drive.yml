name: Sauvegarde vers Google Drive

# À chaque push sur main, chaque lundi matin, et manuellement.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # tous les lundis à 03:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Créer l'archive du projet
        run: |
          ZIP="food-tracker-$(date +%Y-%m-%d).zip"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          zip -r -q "$ZIP" . -x ".git/*"
          ls -lh "$ZIP"

      - name: Vérifier les secrets
        env:
          SA: ${{ secrets.GDRIVE_SA_JSON }}
          FID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          MISS=0
          if [ -z "$SA" ]; then echo "::warning::Secret GDRIVE_SA_JSON MANQUANT"; MISS=1; else echo "GDRIVE_SA_JSON : présent ✔"; fi
          if [ -z "$FID" ]; then echo "::warning::Secret GDRIVE_FOLDER_ID MANQUANT"; MISS=1; else echo "GDRIVE_FOLDER_ID : présent ✔"; fi
          if [ "$MISS" = "1" ]; then
            echo "SKIP=1" >> "$GITHUB_ENV"
            echo "::warning::Envoi ignoré — ajoutez les secrets (voir docs/SAUVEGARDE-DRIVE.md)."
          fi

      - name: Installer rclone
        if: env.SKIP != '1'
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Écrire la clé du compte de service
        if: env.SKIP != '1'
        env:
          SA: ${{ secrets.GDRIVE_SA_JSON }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Envoyer l'archive vers Google Drive
        if: env.SKIP != '1'
        env:
          FID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          rclone copy "$ZIP" \
            ":drive,service_account_file=$RUNNER_TEMP/sa.json,root_folder_id=$FID:" \
            --drive-use-trash=false --verbose
          echo "✅ Archive $ZIP envoyée sur Google Drive."

      - name: Nettoyer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
