name: Sauvegarde vers Google Drive

# À chaque push sur main, chaque lundi matin, et manuellement.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # tous les lundis à 03:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Créer l'archive du projet
        run: |
          ZIP="food-tracker-$(date +%Y-%m-%d).zip"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          zip -r -q "$ZIP" . -x ".git/*"
          ls -lh "$ZIP"

      - name: Vérifier les secrets
        env:
          TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
          FID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          MISS=0
          if [ -z "$TOKEN" ]; then echo "::warning::Secret GDRIVE_RCLONE_TOKEN MANQUANT"; MISS=1; else echo "GDRIVE_RCLONE_TOKEN : présent ✔"; fi
          if [ -z "$FID" ];   then echo "::warning::Secret GDRIVE_FOLDER_ID MANQUANT";   MISS=1; else echo "GDRIVE_FOLDER_ID : présent ✔"; fi
          if [ "$MISS" = "1" ]; then
            echo "SKIP=1" >> "$GITHUB_ENV"
            echo "::warning::Envoi ignoré — ajoutez les secrets (voir docs/SAUVEGARDE-DRIVE.md)."
          fi

      - name: Installer rclone
        if: env.SKIP != '1'
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configurer rclone (votre compte Google)
        if: env.SKIP != '1'
        env:
          TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
          FID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          {
            echo "[gdrive]"
            echo "type = drive"
            echo "scope = drive"
            echo "root_folder_id = ${FID}"
            echo "token = ${TOKEN}"
          } > ~/.config/rclone/rclone.conf

      - name: Envoyer l'archive vers Google Drive
        if: env.SKIP != '1'
        run: |
          rclone copy "$ZIP" gdrive: --drive-use-trash=false --verbose
          echo "✅ Archive $ZIP envoyée dans votre Google Drive."

      - name: Nettoyer
        if: always()
        run: rm -f ~/.config/rclone/rclone.conf
