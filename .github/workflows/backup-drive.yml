name: Sauvegarde vers Google Drive

# À chaque push sur main, chaque lundi matin, et manuellement.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # tous les lundis à 03:00 UTC
  workflow_dispatch: {}

env:
  DRIVE_FOLDER: "Sauvegardes Food-Tracker"   # dossier créé à la racine de votre Drive

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Créer l'archive du projet
        run: |
          ZIP="food-tracker-$(date +%Y-%m-%d).zip"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          zip -r -q "$ZIP" . -x ".git/*"
          ls -lh "$ZIP"

      - name: Vérifier le secret
        env:
          TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Secret GDRIVE_RCLONE_TOKEN MANQUANT — voir docs/SAUVEGARDE-DRIVE.md."
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            echo "GDRIVE_RCLONE_TOKEN : présent ✔"
          fi

      - name: Installer rclone
        if: env.SKIP != '1'
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configurer rclone (votre compte Google)
        if: env.SKIP != '1'
        env:
          TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          {
            echo "[gdrive]"
            echo "type = drive"
            echo "scope = drive"
            echo "token = ${TOKEN}"
          } > ~/.config/rclone/rclone.conf

      - name: Envoyer l'archive vers Google Drive
        if: env.SKIP != '1'
        run: |
          # Dépose dans un dossier (créé automatiquement) à la racine de VOTRE Drive.
          rclone copy "$ZIP" "gdrive:${DRIVE_FOLDER}/" --drive-use-trash=false --verbose
          echo "✅ Archive $ZIP envoyée dans « ${DRIVE_FOLDER} » sur votre Google Drive."

      - name: Nettoyer
        if: always()
        run: rm -f ~/.config/rclone/rclone.conf
