name: Sauvegarde vers Google Drive

# À chaque push sur main, chaque lundi matin, et manuellement.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # tous les lundis à 03:00 UTC
  workflow_dispatch: {}

env:
  DRIVE_FOLDER: "Sauvegardes Food-Tracker"   # utilisé seulement si aucun ID n'est fourni

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Créer l'archive du projet
        run: |
          ZIP="food-tracker-$(date +%Y-%m-%d).zip"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          zip -r -q "$ZIP" . -x ".git/*"
          ls -lh "$ZIP"

      - name: Vérifier le secret
        env:
          TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Secret GDRIVE_RCLONE_TOKEN MANQUANT — voir docs/SAUVEGARDE-DRIVE.md."
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            echo "GDRIVE_RCLONE_TOKEN : présent ✔"
          fi

      - name: Installer rclone
        if: env.SKIP != '1'
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configurer rclone et envoyer
        if: env.SKIP != '1'
        env:
          TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
          FID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          # Nettoyage tolérant de l'ID : accepte aussi une URL complète collée par erreur
          FID="${FID##*/folders/}"     # retire https://…/folders/
          FID="${FID%%\?*}"            # retire ?usp=…
          FID="$(printf '%s' "$FID" | tr -d '[:space:]')"

          mkdir -p ~/.config/rclone
          {
            echo "[gdrive]"
            echo "type = drive"
            echo "scope = drive"
            echo "token = ${TOKEN}"
            if [ -n "$FID" ]; then echo "root_folder_id = ${FID}"; fi
          } > ~/.config/rclone/rclone.conf

          if [ -n "$FID" ]; then
            echo "Destination : dossier ID ${FID}"
            DEST="gdrive:"
          else
            echo "Destination : dossier « ${DRIVE_FOLDER} » (créé par nom, à la racine)"
            DEST="gdrive:${DRIVE_FOLDER}/"
          fi

          rclone copy "$ZIP" "$DEST" --drive-use-trash=false --verbose
          echo "✅ Archive $ZIP envoyée sur votre Google Drive."

      - name: Nettoyer
        if: always()
        run: rm -f ~/.config/rclone/rclone.conf
